<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4f7a63"><link rel="manifest" href="/manifest.webmanifest"><title>JLPT 일본어 단어</title><style>
:root{--bg:#f5f7f2;--card:#fff;--accent:#4f7a63;--accent2:#e7efe9;--text:#20312a;--muted:#6b786f;--line:#dfe6df;--bad:#b04b4b}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:10;background:rgba(245,247,242,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 16px}
.wrap{max-width:760px;margin:0 auto} h1{font-size:20px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px}
nav{display:flex;gap:8px;padding:14px 0 0;overflow:auto} button{border:0;border-radius:12px;padding:10px 14px;font-size:14px;cursor:pointer}
nav button{background:#fff;border:1px solid var(--line);white-space:nowrap} nav button.active{background:var(--accent);color:#fff}
main{padding:18px 16px 80px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 6px 24px rgba(35,55,45,.06)}
.bigword{font-size:44px;font-weight:800;text-align:center;margin-top:8px}.reading{text-align:center;font-size:20px;color:var(--accent);margin-top:4px}.meaning{text-align:center;font-size:20px;margin:8px 0 18px}
.box{background:var(--accent2);border-radius:14px;padding:14px;margin-top:12px}.label{font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:700}.example{font-size:17px;line-height:1.7}.translation{color:var(--muted);margin-top:6px;line-height:1.6}
.row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.row button{flex:1;background:var(--accent);color:#fff;min-width:110px}.row button.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}
.progress{height:8px;background:#e6ebe7;border-radius:99px;overflow:hidden;margin-top:10px}.progress>div{height:100%;background:var(--accent);width:0}.stats{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:10px 2px 0}
.list-item{display:flex;align-items:center;gap:12px;padding:14px 8px;border-bottom:1px solid var(--line)}.list-word{font-size:20px;font-weight:700;min-width:108px}.list-info{flex:1}.list-read{color:var(--accent);font-size:13px}.list-mean{font-size:14px}.badge{border-radius:999px;padding:5px 9px;font-size:12px;background:var(--accent2);color:var(--accent)}
.search{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;font-size:15px;margin-bottom:10px}.choice{width:100%;text-align:left;background:#fff;border:1px solid var(--line);margin:7px 0;padding:14px}.choice.correct{outline:2px solid #3d8b5e}.choice.wrong{outline:2px solid var(--bad)}
.center{text-align:center}.hidden{display:none!important}.notice{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.5}

.daybar{display:flex;gap:8px;margin:10px 0 0}.daybar button{background:#fff;border:1px solid var(--line)}.daybar button.active{background:#20312a;color:#fff}.homegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.daycard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;cursor:pointer}.daycard h3{margin:0 0 6px}.daycard .sub{line-height:1.5}@media(max-width:520px){.homegrid{grid-template-columns:1fr}.bigword{font-size:38px}}</style></head><body>
<header><div class="wrap"><h1 id="title">JLPT 일본어 단어</h1><div class="sub" id="subtitle">DAY를 선택해 공부하세요</div><div class="daybar"><button id="homeBtn">DAY 선택</button><button data-day="18">DAY 18</button><button data-day="27">DAY 27</button><button data-day="37">DAY 37</button></div><div id="studyHead" class="hidden"><div class="progress"><div id="progressBar"></div></div><div class="stats"><span id="statKnown"></span><span id="statTotal"></span></div><nav><button data-tab="cards" class="active">단어카드</button><button data-tab="list">전체목록</button><button data-tab="quiz">퀴즈</button><button data-tab="review">오답복습</button></nav></div></div></header>
<main class="wrap"><section id="home"><div class="homegrid"><div class="daycard" data-open="18"><h3>DAY 18 · 일상생활</h3><div class="sub">39단어 · 생활·행동·상태 표현</div></div><div class="daycard" data-open="27"><h3>DAY 27 · 인물·성격</h3><div class="sub">39단어 · 성격·능력 표현</div></div><div class="daycard" data-open="37"><h3>DAY 37 · 자연·환경</h3><div class="sub">39단어 · 자연·환경 표현</div></div></div></section>
<section id="cards" class="hidden"><div class="card"><div class="center sub" id="counter"></div><div class="bigword" id="word"></div><div class="reading" id="reading"></div><div class="meaning" id="meaning"></div><div class="box"><div class="label">한자 풀이</div><div id="parts"></div></div><div class="box"><div class="label">예문</div><div class="example" id="example"></div><div class="translation" id="translation"></div></div><div class="row"><button class="secondary" id="prevBtn">이전</button><button class="secondary" id="unknownBtn">다시 보기</button><button id="knownBtn">외웠어요</button><button class="secondary" id="nextBtn">다음</button></div><div class="notice">예문은 사진 속 교재 문장을 복사하지 않고 학습용으로 새로 만들었습니다.</div></div></section>
<section id="list" class="hidden"><input id="search" class="search" placeholder="단어·읽기·뜻 검색"><div class="card" id="listWrap"></div></section>
<section id="quiz" class="hidden"><div class="card"><div class="sub center">뜻 맞히기</div><div class="bigword" id="quizWord"></div><div class="reading" id="quizReading"></div><div id="choices" style="margin-top:20px"></div><div class="row"><button id="nextQuiz" class="hidden">다음 문제</button></div><div class="center sub" id="quizScore" style="margin-top:12px"></div></div></section>
<section id="review" class="hidden"><div class="card"><h2 style="margin-top:0">다시 볼 단어</h2><div id="reviewWrap"></div></div></section></main>
<script>const DAYS={"18": [{"word": "日常", "reading": "にちじょう", "meaning": "일상", "parts": "日(날) + 常(항상)", "example": "日常でよく使う表現を覚えています。", "translation": "일상에서 자주 쓰는 표현을 외우고 있습니다."}, {"word": "暮らす", "reading": "くらす", "meaning": "살다, 생활하다", "parts": "暮(저물다·생활하다)", "example": "家族と静かな町で暮らしています。", "translation": "가족과 조용한 마을에서 살고 있습니다."}, {"word": "一人暮らし", "reading": "ひとりぐらし", "meaning": "혼자 사는 생활, 자취", "parts": "一人(혼자) + 暮らし(생활)", "example": "大学に入って一人暮らしを始めました。", "translation": "대학에 들어가 자취를 시작했습니다."}, {"word": "普段", "reading": "ふだん", "meaning": "평소", "parts": "普(널리) + 段(단계)", "example": "普段は七時ごろに起きます。", "translation": "평소에는 7시쯤 일어납니다."}, {"word": "常に", "reading": "つねに", "meaning": "항상, 늘", "parts": "常(항상) + に", "example": "安全を常に確認してください。", "translation": "안전을 항상 확인해 주세요."}, {"word": "転ぶ", "reading": "ころぶ", "meaning": "구르다, 넘어지다", "parts": "転(구르다·옮기다)", "example": "雨の日に道で転びました。", "translation": "비 오는 날 길에서 넘어졌습니다."}, {"word": "困る", "reading": "こまる", "meaning": "곤란하다", "parts": "困(곤란하다)", "example": "急に予定が変わると困ります。", "translation": "갑자기 일정이 바뀌면 곤란합니다."}, {"word": "割れる", "reading": "われる", "meaning": "갈라지다, 깨지다, 나누어지다", "parts": "割(나누다·깨다)", "example": "コップが床に落ちて割れました。", "translation": "컵이 바닥에 떨어져 깨졌습니다."}, {"word": "苦労", "reading": "くろう", "meaning": "고생", "parts": "苦(괴롭다) + 労(수고)", "example": "最初は慣れなくて苦労しました。", "translation": "처음에는 익숙하지 않아 고생했습니다."}, {"word": "やぶる", "reading": "やぶる", "meaning": "약속 등을 깨다, 찢다", "parts": "히라가나 표기 동사", "example": "約束をやぶってはいけません。", "translation": "약속을 어기면 안 됩니다."}, {"word": "切れる", "reading": "きれる", "meaning": "끊어지다, 떨어지다", "parts": "切(끊다) + れる", "example": "電話の途中で電池が切れました。", "translation": "통화 도중 배터리가 다 되었습니다."}, {"word": "手に入る", "reading": "てにはいる", "meaning": "손에 들어오다, 구하게 되다", "parts": "手(손) + 入(들다)", "example": "欲しかった本がやっと手に入りました。", "translation": "갖고 싶던 책을 드디어 구했습니다."}, {"word": "横になる", "reading": "よこになる", "meaning": "눕다", "parts": "横(옆) + になる", "example": "少し疲れたので横になります。", "translation": "조금 피곤해서 눕겠습니다."}, {"word": "お茶を入れる", "reading": "おちゃを lation": "저 가수의 부드러운 목소리를 좋아해요."}, {"word": "意外", "reading": "いがい", "meaning": "의외", "parts": "意(뜻) + 外(밖)", "example": "普段は静かな本田くんが積極的に意見を述べたのは意外だった。", "translation": "평소에는 조용한 혼다 군이 적극적으로 의견을 말한 것은 의외였다."}, {"word": "正直だ", "reading": "しょうじきだ", "meaning": "정직하다", "parts": "正(바르다) + 直(곧다)", "example": "山本さんはとても正直な人で決して嘘をつかない。", "translation": "야마모토 씨는 매우 정직한 사람이라서 결코 거짓말을 하지 않는다."}, {"word": "活気", "reading": "かっき", "meaning": "활기", "parts": "活(살다) + 気(기운)", "example": "松田さんほど明るくて活気がある人は見たことがない。", "translation": "마쓰다 씨만큼 밝고 활기가 있는 사람은 본 적이 없다."}, {"word": "はきはき", "reading": "はきはき", "meaning": "시원시원", "parts": "의태어", "example": "新しく来た生徒は大きな声ではきはきと自己紹介をしました。", "translation": "새로 온 학생은 큰 목소리로 시원시원하게 자기소개를 했습니다."}, {"word": "のろのろ", "reading": "のろのろ", "meaning": "느릿느릿, 굼뜨게", "parts": "의태어", "example": "細い道でのろのろ歩いたら後ろの人に迷惑になるかもしれないよ。", "translation": "좁은 길에서 느릿느릿 걸으면 뒷사람에게 민폐가 될지도 몰라."}, {"word": "のんびり", "reading": "のんびり", "meaning": "한가로이, 태평스럽게", "parts": "부사", "example": "いつものんびりしている彼だが最近は引っ越しの準備で忙しそう。", "translation": "언제나 한가로이 있는 그이지만 최근에는 이사 준비로 바쁜 것 같다."}, {"word": "上品だ", "reading": "じょうひんだ", "meaning": "고상하다", "parts": "上(위) + 品(품격)", "example": "吉田さんはなぜか上品な雰囲気を持っています。", "translation": "요시다 씨는 왠지 고상한 분위기를 가지고 있습니다."}, {"word": "下品だ", "reading": "げひんだ", "meaning": "품위가 없다", "parts": "下(아래) + 品(품격)", "example": "他人にそんな下品な言葉を使うのはよくないですよ。", "translation": "다른 사람에게 그런 품위가 없는 말을 쓰는 것은 좋지 않아요."}, {"word": "短気だ", "reading": "たんきだ", "meaning": "성급하다, 성미가 급하다", "parts": "短(짧다) + 気(기운)", "example": "短気な性格で小さいことにもいらいらしてしまうのが私の短所だ。", "translation": "성급한 성격이라 작은 일에도 조바심을 내버리는 것이 나의 단점이다."}, {"word": "しつこい", "reading": "しつこい", "meaning": "끈질기다", "parts": "い형용사", "example": "相手の選手がしつこくついてきたから速く走って間隔を広げた。", "translation": "상대 선수가 끈질기게 따라왔기 때문에 빨리 달려서 간격을 벌렸다."}, {"word": "図々しい", "reading": "ずうずうしい", "meaning": "뻔뻔스럽다", "parts": "図(도모하다) + 々 + しい", "example": "約束の時間に遅れたのに謝らないなんて本当に図々しい人だ。", "translation": "약속 시간에 늦었는데 사과하지 않는다니 정말 뻔뻔스러운 사람이다."}, {"word": "わがまま", "reading": "わがまま", "meaning": "버릇없음, 제멋대로 함", "parts": "명사·형용동사적 표현", "example": "小さい頃はわがままで公共交通機関の中でもうるさくしたものだ。", "translation": "어렸을 때는 버릇없어서 대중교통 안에서도 시끄럽게 굴곤 했다."}, {"word": "消極的だ", "reading": "しょうきょくてきだ", "meaning": "소극적이다", "parts": "消極(소극) + 的", "example": "そんなに消極的な態度では相手を納得させられません。", "translation": "그렇게 소극적인 태도로는 상대를 납득시킬 수 없어요."}, {"word": "そそっかしい", "reading": "そそっかしい", "meaning": "조심성이 없다, 덜렁대다", "parts": "い형용사", "example": "鈴木さんはそそっかしくて、よく物を無くしてしまいます。", "translation": "스즈키 씨는 조심성이 없어서, 자주 물건을 잃어버립니다."}, {"word": "偉い", "reading": "えらい", "meaning": "대단하다, 훌륭하다", "parts": "偉(훌륭하다)", "example": "週末にもかかわらず寝坊しないで早起きする人は偉いと思う。", "translation": "주말인데도 불구하고 늦잠 자지 않고 일찍 일어나는 사람은 대단하다고 생각한다."}, {"word": "業績", "reading": "ぎょうせき", "meaning": "업적", "parts": "業(일) + 績(공적)", "example": "あの人は町の発展にたくさんの業績を残しました。", "translation": "저 사람은 마을의 발전에 많은 업적을 남겼습니다."}, {"word": "器用だ", "reading": "きようだ", "meaning": "재주 있다", "parts": "器(그릇) + 用(쓰다)", "example": "坂本さんはかばんも自分で作れるほど器用だそうだ。", "translation": "사카모토 씨는 가방도 스스로 만들 수 있을 정도로 재주가 있다고 한다."}, {"word": "優れる", "reading": "すぐれる", "meaning": "뛰어나다", "parts": "優(뛰어나다)", "example": "彼女はチームを正しい方向に導く優れたリーダーです。", "translation": "그녀는 팀을 올바른 방향으로 이끄는 뛰어난 리더입니다."}, {"word": "能力", "reading": "のうりょく", "meaning": "능력", "parts": "能(능하다) + 力(힘)", "example": "英語の能力を高めるためにアメリカのニュースを見るつもりです。", "translation": "영어 능력을 높이기 위해서 미국 뉴스를 볼 생각입니다."}, {"word": "向く", "reading": "むく", "meaning": "적합하다, 향하다", "parts": "向(향하다)", "example": "この仕事は外国語が上手な彼女に向いていると思います。", "translation": "이 일은 외국어를 잘하는 그녀에게 적합하다고 생각합니다."}, {"word": "常識", "reading": "じょうしき", "meaning": "상식", "parts": "常(항상) + 識(알다)", "example": "パクさんは様々な方面で常識がある人だ。", "translation": "박 씨는 다양한 방면에서 상식이 있는 사람이다."}, {"word": "判断力", "reading": "はんだんりょく", "meaning": "판단력", "parts": "判断(판단) + 力(힘)", "example": "会社の代表には責任感だけでなく正しい判断力が求められる。", "translation": "회사 대표에게는 책임감뿐만 아니라 올바른 판단력이 요구된다."}, {"word": "表現力", "reading": "ひょうげんりょく", "meaning": "표현력", "parts": "表現(표현) + 力(힘)", "example": "歌の表現力を高めるために、裏でたくさん練習しました。", "translation": "노래의 표현력을 높이기 위해서, 보이지 않는 곳에서 많이 연습했습니다."}, {"word": "分かりやすい", "reading": "わかりやすい", "meaning": "알기 쉽다", "parts": "分かる(알다) + やすい(쉽다)", "example": "彼は考えていることがすぐ顔に出るのでとても分かりやすい人だ。", "translation": "그는 생각하고 있는 것이 바로 얼굴에 나타나기 때문에 매우 알기 쉬운 사람이다."}, {"word": "頭がいい", "reading": "あたまがいい", "meaning": "머리가 좋다", "parts": "頭(머리) + いい", "example": "木村さんは頭がよくて山手線の電車の時刻表を全て覚えている。", "translation": "기무라 씨는 머리가 좋아서 야마노테 선의 전철 시간표를 모두 외우고 있다."}, {"word": "変だ", "reading": "へんだ", "meaning": "이상하다", "parts": "変(변하다·이상하다)", "example": "私の冗談がつまらなかったのか、友だちは変な顔をしていました。", "translation": "제 농담이 재미없었는지, 친구들은 이상한 표정을 짓고 있었습니다."}]}; const META={'18':'DAY 18 · 일상생활','27':'DAY 27 · 인물·성격','37':'DAY 37 · 자연·환경'}; let day=null,words=[],idx=0,known=new Set(),review=new Set(),quizAnswered=false,quizCorrect=0,quizCount=0,currentQuiz=null; const $=id=>document.getElementById(id);
function key(n){return `jp_${day}_${n}`} function loadState(){idx=Number(localStorage.getItem(key('idx'))||0);known=new Set(JSON.parse(localStorage.getItem(key('known'))||'[]'));review=new Set(JSON.parse(localStorage.getItem(key('review'))||'[]'));if(idx>=words.length)idx=0} function save(){localStorage.setItem(key('idx'),idx);localStorage.setItem(key('known'),JSON.stringify([...known]));localStorage.setItem(key('review'),JSON.stringify([...review]))}
function openDay(d){day=d;words=DAYS[d];loadState();$('home').classList.add('hidden');$('studyHead').classList.remove('hidden');$('title').textContent=META[d];$('subtitle').textContent=`${words.length}단어 · 단어카드 + 한자 풀이 + 예문 + 퀴즈 + 오답복습`;document.querySelectorAll('.daybar button[data-day]').forEach(b=>b.classList.toggle('active',b.dataset.day===d));switchTab('cards');renderCard();renderReview()}
function goHome(){day=null;$('title').textContent='JLPT 일본어 단어';$('subtitle').textContent='DAY를 선택해 공부하세요';$('studyHead').classList.add('hidden');['cards','list','quiz','review'].forEach(x=>$(x).classList.add('hidden'));$('home').classList.remove('hidden');document.querySelectorAll('.daybar button').forEach(b=>b.classList.remove('active'))}
function updateStats(){$('progressBar').style.width=(known.size/words.length*100)+'%';$('statKnown').textContent=`암기 ${known.size}`;$('statTotal').textContent=`${idx+1} / ${words.length}`} function renderCard(){const w=words[idx];$('counter').textContent=`${idx+1} / ${words.length}`;$('word').textContent=w.word;$('reading').textContent=w.reading;$('meaning').textContent=w.meaning;$('parts').textContent=w.parts;$('example').textContent=w.example;$('translation').textContent=w.translation;$('knownBtn').textContent=known.has(idx)?'암기 완료 ✓':'외웠어요';$('unknownBtn').textContent=review.has(idx)?'복습 등록 ✓':'다시 보기';updateStats();save()}
$('prevBtn').onclick=()=>{idx=(idx-1+words.length)%words.length;renderCard()};$('nextBtn').onclick=()=>{idx=(idx+1)%words.length;renderCard()};$('knownBtn').onclick=()=>{known.add(idx);review.delete(idx);idx=(idx+1)%words.length;renderCard();renderReview()};$('unknownBtn').onclick=()=>{review.add(idx);renderCard();renderReview()};
function renderList(filter=''){const q=filter.trim().toLowerCase();$('listWrap').innerHTML='';words.forEach((w,i)=>{if(q&&!`${w.word} ${w.reading} ${w.meaning}`.toLowerCase().includes(q))return;const el=document.createElement('div');el.className='list-item';el.innerHTML=`<div class="list-word">${w.word}</div><div class="list-info"><div class="list-read">${w.reading}</div><div class="list-mean">${w.meaning}</div></div><span class="badge">${known.has(i)?'암기완료':review.has(i)?'복습':'학습전'}</span>`;el.onclick=()=>{idx=i;switchTab('cards');renderCard()};$('listWrap').appendChild(el)})} $('search').oninput=e=>renderList(e.target.value);function shuffled(a){return [...a].sort(()=>Math.random()-.5)}
function newQuiz(){quizAnswered=false;$('nextQuiz').classList.add('hidden');currentQuiz=Math.floor(Math.random()*words.length);const w=words[currentQuiz];$('quizWord').textContent=w.word;$('quizReading').textContent=w.reading;const wrongs=shuffled(words.map((x,i)=>({m:x.meaning,i})).filter(x=>x.i!==currentQuiz)).slice(0,3);const opts=shuffled([{m:w.meaning,i:currentQuiz},...wrongs]);$('choices').innerHTML='';opts.forEach(o=>{const b=document.createElement('button');b.className='choice';b.textContent=o.m;b.onclick=()=>{if(quizAnswered)return;quizAnswered=true;quizCount++;if(o.i===currentQuiz){b.classList.add('correct');quizCorrect++;known.add(currentQuiz);review.delete(currentQuiz)}else{b.classList.add('wrong');review.add(currentQuiz);[...$('choices').children].forEach(c=>{if(c.textContent===w.meaning)c.classList.add('correct')})}$('quizScore').textContent=`${quizCorrect} / ${quizCount} 정답`;$('nextQuiz').classList.remove('hidden');save();updateStats();renderReview()};$('choices').appendChild(b)})} $('nextQuiz').onclick=newQuiz;
function renderReview(){$('reviewWrap').innerHTML='';if(review.size===0){$('reviewWrap').innerHTML='<div class="sub">아직 복습할 단어가 없어요.</div>';return}[...review].forEach(i=>{const w=words[i],el=document.createElement('div');el.className='list-item';el.innerHTML=`<div class="list-word">${w.word}</div><div class="list-info"><div class="list-read">${w.reading}</div><div class="list-mean">${w.meaning}</div></div>`;el.onclick=()=>{idx=i;switchTab('cards');renderCard()};$('reviewWrap').appendChild(el)})}
function switchTab(name){['cards','list','quiz','review'].forEach(id=>$(id).classList.toggle('hidden',id!==name));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));if(name==='list')renderList($('search').value);if(name==='quiz')newQuiz();if(name==='review')renderReview()} document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));document.querySelectorAll('[data-open]').forEach(e=>e.onclick=()=>openDay(e.dataset.open));document.querySelectorAll('.daybar button[data-day]').forEach(e=>e.onclick=()=>openDay(e.dataset.day));$('homeBtn').onclick=goHome;if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
</script></body></html>
