<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4f7a63"><link rel="manifest" href="manifest.webmanifest"><title>JLPT 일본어 단어</title><style>
:root{--bg:#f5f7f2;--card:#fff;--accent:#4f7a63;--accent2:#e7efe9;--text:#20312a;--muted:#6b786f;--line:#dfe6df;--bad:#b04b4b}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:10;background:rgba(245,247,242,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 16px}
.wrap{max-width:760px;margin:0 auto} h1{font-size:20px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px}
nav{display:flex;gap:8px;padding:14px 0 0;overflow:auto} button{border:0;border-radius:12px;padding:10px 14px;font-size:14px;cursor:pointer}
nav button{background:#fff;border:1px solid var(--line);white-space:nowrap} nav button.active{background:var(--accent);color:#fff}
main{padding:18px 16px 80px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 6px 24px rgba(35,55,45,.06)}
.bigword{font-size:44px;font-weight:800;text-align:center;margin-top:8px}.reading{text-align:center;font-size:20px;color:var(--accent);margin-top:4px}.meaning{text-align:center;font-size:20px;margin:8px 0 18px}
.box{background:var(--accent2);border-radius:14px;padding:14px;margin-top:12px}.label{font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:700}.example{font-size:17px;line-height:1.7}.translation{color:var(--muted);margin-top:6px;line-height:1.6}
.row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.row button{flex:1;background:var(--accent);color:#fff;min-width:110px}.row button.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}
.progress{height:8px;background:#e6ebe7;border-radius:99px;overflow:hidden;margin-top:10px}.progress>div{height:100%;background:var(--accent);width:0}.stats{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:10px 2px 0}
.list-item{display:flex;align-items:center;gap:12px;padding:14px 8px;border-bottom:1px solid var(--line)}.list-word{font-size:20px;font-weight:700;min-width:108px}.list-info{flex:1}.list-read{color:var(--accent);font-size:13px}.list-mean{font-size:14px}.badge{border-radius:999px;padding:5px 9px;font-size:12px;background:var(--accent2);color:var(--accent)}
.search{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;font-size:15px;margin-bottom:10px}.choice{width:100%;text-align:left;background:#fff;border:1px solid var(--line);margin:7px 0;padding:14px}.choice.correct{outline:2px solid #3d8b5e}.choice.wrong{outline:2px solid var(--bad)}
.center{text-align:center}.hidden{display:none!important}.notice{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.5}

.daybar{display:flex;gap:8px;margin:10px 0 0}.daybar button{background:#fff;border:1px solid var(--line)}.daybar button.active{background:#20312a;color:#fff}.homegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.daycard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;cursor:pointer}.daycard h3{margin:0 0 6px}.daycard .sub{line-height:1.5}@media(max-width:520px){.homegrid{grid-template-columns:1fr}.bigword{font-size:38px}}
.grammar-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.grammar-toolbar button{background:#fff;border:1px solid var(--line)}
.grammar-toolbar button.active{background:var(--accent);color:#fff}
.grammar-item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0;cursor:pointer}
.grammar-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grammar-pattern{font-size:20px;font-weight:800;color:var(--text)}
.grammar-meaning{margin-top:7px;font-size:15px}
.grammar-detail{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.grammar-example{font-size:16px;line-height:1.7}
.grammar-kor{font-size:14px;color:var(--muted);margin-top:5px;line-height:1.6}
.grammar-count{font-size:13px;color:var(--muted);margin:6px 0 12px}

.grammar-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.grammar-nav button{background:#fff;border:1px solid var(--line)}
.grammar-nav button.active{background:#20312a;color:#fff}
.grammar-filter-label{font-size:12px;color:var(--muted);font-weight:800;margin:12px 0 6px}
.grammar-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.grammar-actions button{padding:8px 10px;background:#fff;border:1px solid var(--line);font-size:13px}
.grammar-actions button.on{background:var(--accent2);color:var(--accent);font-weight:800}
.grammar-level{display:inline-block;margin-left:6px;border-radius:999px;padding:5px 9px;font-size:12px;background:#f3efe5;color:#745f37}
.grammar-empty{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center;color:var(--muted)}
.grammar-quiz-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 6px 24px rgba(35,55,45,.06)}
.grammar-quiz-pattern{font-size:28px;font-weight:850;text-align:center;margin:12px 0 20px}
.grammar-quiz-score{text-align:center;color:var(--muted);font-size:13px;margin-top:12px}
.grammar-mini{font-size:12px;color:var(--muted);line-height:1.55;margin:10px 0}
.speaker-btn{background:#fff!important;color:var(--text)!important;border:1px solid var(--line)!important}
</style></head><body>
<header><div class="wrap"><h1 id="title">JLPT 일본어 단어</h1><div class="sub" id="subtitle">DAY를 선택해 공부하세요</div><div class="daybar"><button id="homeBtn">DAY 선택</button><button data-day="18">DAY 18</button><button data-day="37">DAY 37</button><button id="grammarBtn">문법 50</button></div><div id="studyHead" class="hidden"><div class="progress"><div id="progressBar"></div></div><div class="stats"><span id="statKnown"></span><span id="statTotal"></span></div><nav><button data-tab="cards" class="active">단어카드</button><button data-tab="list">전체목록</button><button data-tab="quiz">퀴즈</button><button data-tab="review">오답복습</button></nav></div></div></header>
<main class="wrap"><section id="home"><div class="homegrid"><div class="daycard" data-open="18"><h3>DAY 18 · 일상생활</h3><div class="sub">39단어 · 생활·행동·상태 표현</div></div><div class="daycard" data-open="37"><h3>DAY 37 · 자연·환경</h3><div class="sub">39단어 · 자연·환경 표현</div></div></div></section>

    <div class="grammar-count" id="grammarCount"></div>

<section id="cards" class="hidden"><div class="card"><div class="center sub" id="counter"></div><div class="bigword" id="word"></div><div class="reading" id="reading"></div><div class="meaning" id="meaning"></div><div class="box"><div class="label">한자 풀이</div><div id="parts"></div></div><div class="box"><div class="label">예문</div><div class="example" id="example"></div><div class="translation" id="translation"></div></div><div class="row"><button class="secondary" id="prevBtn">이전</button><button class="secondary" id="unknownBtn">다시 보기</button><button id="knownBtn">외웠어요</button><button class="secondary" id="nextBtn">다음</button></div><div class="notice">예문은 사진 속 교재 문장을 복사하지 않고 학습용으로 새로 만들었습니다.</div></div></section>

<script>const DAYS={"18": [{"word": "日常", "reading": "にちじょう", "meaning": "일상", "parts": "日(날) + 常(항상)", "example": "日常でよく使う表現を覚えています。", "translation": "일상에서 자주 쓰는 표현을 외우고 있습니다."}, {"word": "暮らす", "reading": "くらす", "meaning": "살다, 생활하다", "parts": "暮(저물다·생활하다)", "example": "家族と静かな町で暮らしています。", "translation": "가족과 조용한 마을에서 살고 있습니다."}, {"word": "一人暮らし", "reading": "ひとりぐらし", "meaning": "혼자 사는 생활, 자취", "parts": "一人(혼자) + 暮らし(생활)", "example": "大学に入って一人暮らしを始めました。", "translation": "대학에 들어가 자취를 시작했습니다."}, {"word": "普段", "reading": "ふだん", "meaning": "평소", "parts": "普(널리) + 段(단계)", "example": "普段は七時ごろに起きます。", "translation": "평소에는 7시쯤 일어납니다."}, {"word": "常に", "reading": "つねに", "meaning": "항상, 늘", "parts": "常(항상) + に", "example": "安全を常に確認してください。", "translation": "안전을 항상 확인해 주세요."}, {"word": "転ぶ", "reading": "ころぶ", "meaning": "구르다, 넘어지다", "parts": "転(구르다·옮기다)", "example": "雨の日に道で転びました。", "translation": "비 오는 날 길에서 넘어졌습니다."}, {"word": "困る", "reading": "こまる", "meaning": "곤란하다", "parts": "困(곤란하다)", "example": "急に予定が変わると困ります。", "translation": "갑자기 일정이 바뀌면 곤란합니다."}, {"word": "割れる", "reading": "われる", "meaning": "갈라지다, 깨지다, 나누어지다", "parts": "割(나누다·깨다)", "example": "コップが床に落ちて割れました。", "translation": "컵이 바닥에 떨어져 깨졌습니다."}, {"word": "苦労", "reading": "くろう", "meaning": "고생", "parts": "苦(괴롭다) + 労(수고)", "example": "最初は慣れなくて苦労しました。", "translation": "처음에는 익숙하지 않아 고생했습니다."}, {"word": "やぶる", "reading": "やぶる", "meaning": "약속 등을 깨다, 찢다", "parts": "히라가나 표기 동사", "example": "約束をやぶってはいけません。", "translation": "약속을 어기면 안 됩니다."}, {"word": "切れる", "reading": "きれる", "meaning": "끊어지다, 떨어지다", "parts": "切(끊다) + れる", "example": "電話の途中で電池が切れました。", "translation": "통화 도중 배터리가 다 되었습니다."}, {"word": "手に入る", "reading": "てにはいる", "meaning": "손에 들어오다, 구하게 되다", "parts": "手(손) + 入(들다)", "example": "欲しかった本がやっと手に入りました。", "translation": "갖고 싶던 책을 드디어 구했습니다."}, {"word": "横になる", "reading": "よこになる", "meaning": "눕다", "parts": "横(옆) + になる", "example": "少し疲れたので横になります。", "translation": "조금 피곤해서 눕겠습니다."}, {"word": "お茶を入れる", "reading": "おちゃを function speakJapanese(text){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ja-JP'; u.rate=.82;
  const voices=speechSynthesis.getVoices();
  const v=voices.find(x=>x.lang&&x.lang.toLowerCase().startsWith('ja'));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}

function openGrammar(){
  day=null;
  ['home','cards','list','quiz','review'].forEach(x=>$(x).classList.add('hidden'));
  $('studyHead').classList.add('hidden');
  $('grammar').classList.remove('hidden');
  $('title').textContent='JLPT 일본어 문법';
  $('subtitle').textContent='빈출 문법 50 · 즐겨찾기 + 복습 + 퀴즈 + 음성';
  document.querySelectorAll('.daybar button').forEach(b=>b.classList.remove('active'));
  $('grammarBtn').classList.add('active');
  setGrammarMode(grammarMode);
}

function setGrammarMode(mode){
  grammarMode=mode;
  document.querySelectorAll('[data-grammar-mode]').forEach(b=>b.classList.toggle('active',b.dataset.grammarMode===mode));
  $('grammarListTools').classList.toggle('hidden',mode==='quiz');
  $('grammarQuizArea').classList.toggle('hidden',mode!=='quiz');
  if(mode==='quiz') newGrammarQuiz();
  else renderGrammar();
}

function grammarFiltered(){
  const q=$('grammarSearch').value.trim().toLowerCase();
  return GRAMMAR.map((g,i)=>({...g,_i:i})).filter(g=>
    (grammarGroup==='all'||g.group===grammarGroup) &&
    (grammarLevel==='all'||g.level===grammarLevel) &&
    (!q || `${g.pattern} ${g.meaning} ${g.example} ${g.translation}`.toLowerCase().includes(q)) &&
    (grammarMode!=='saved'||grammarFav.has(g._i)||grammarReview.has(g._i))
  );
}

function renderGrammar(){
  const filtered=grammarFiltered();
  const savedNote=grammarMode==='saved'?` · 즐겨찾기 ${grammarFav.size} / 복습 ${grammarReview.size}`:'';
  $('grammarCount').textContent=`${filtered.length}개 문법${savedNote}`;

  if(!filtered.length){
    $('grammarWrap').innerHTML='<div class="grammar-empty">조건에 맞는 문법이 없어요.<br>필터를 바꾸거나 ★ 즐겨찾기 / 다시보기 문법을 등록해 보세요.</div>';
    return;
  }

  $('grammarWrap').innerHTML=filtered.map(g=>`
    <div class="grammar-item" data-grammar-index="${g._i}">
      <div class="grammar-top">
        <div>
          <div><span class="badge">${g.group}</span><span class="grammar-level">${g.level}</span></div>
          <div class="grammar-pattern">${g.pattern}</div>
          <div class="grammar-meaning">${g.meaning}</div>
        </div>
        <div class="sub">눌러서 예문 보기</div>
      </div>
      <div class="grammar-detail hidden">
        <div class="label">예문</div>
        <div class="grammar-example">${g.example}</div>
        <div class="grammar-kor">${g.translation}</div>
        <div class="grammar-actions">
          <button class="speaker-btn grammar-speak" data-i="${g._i}">🔊 예문 듣기</button>
          <button class="grammar-fav ${grammarFav.has(g._i)?'on':''}" data-i="${g._i}">${grammarFav.has(g._i)?'★ 즐겨찾기':'☆ 즐겨찾기'}</button>
          <button class="grammar-review ${grammarReview.has(g._i)?'on':''}" data-i="${g._i}">${grammarReview.has(g._i)?'✓ 다시보기 등록':'↻ 다시보기'}</button>
        </div>
      </div>
    </div>`).join('');

  document.querySelectorAll('.grammar-item').forEach(el=>el.onclick=e=>{
    if(e.target.closest('button'))return;
    el.querySelector('.grammar-detail').classList.toggle('hidden');
  });
  document.querySelectorAll('.grammar-speak').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); speakJapanese(GRAMMAR[+b.dataset.i].example);
  });
  document.querySelectorAll('.grammar-fav').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); const i=+b.dataset.i;
    grammarFav.has(i)?grammarFav.delete(i):grammarFav.add(i);
    saveGrammarState(); renderGrammar();
  });
  document.querySelectorAll('.grammar-review').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); const i=+b.dataset.i;
    grammarReview.has(i)?grammarReview.delete(i):grammarReview.add(i);
    saveGrammarState(); renderGrammar();
  });
}

function newGrammarQuiz(){
  grammarQuizAnswered=false;
  const pool=GRAMMAR.map((g,i)=>({...g,_i:i})).filter(g=>
    (grammarGroup==='all'||g.group===grammarGroup) &&
    (grammarLevel==='all'||g.level===grammarLevel)
  );
  if(!pool.length)return;
  const target=pool[Math.floor(Math.random()*pool.length)];
  currentGrammarQuiz=target._i;
  const wrongs=shuffled(GRAMMAR.map((g,i)=>({meaning:g.meaning,i})).filter(x=>x.i!==target._i)).slice(0,3);
  const opts=shuffled([{meaning:target.meaning,i:target._i},...wrongs]);

  $('grammarQuizArea').innerHTML=`<div class="grammar-quiz-card">
    <div class="sub center">문법의 뜻을 고르세요</div>
    <div class="grammar-quiz-pattern">${target.pattern}</div>
    <div id="grammarQuizChoices"></div>
    <div id="grammarQuizResult"></div>
    <div class="row">
      <button class="speaker-btn" id="grammarQuizHear">🔊 예문 듣기</button>
      <button id="nextGrammarQuiz" class="hidden">다음 문제</button>
    </div>
    <div class="grammar-quiz-score">${grammarQuizCorrect} / ${grammarQuizCount} 정답</div>
  </div>`;

  opts.forEach(o=>{
    const b=document.createElement('button'); b.className='choice'; b.textContent=o.meaning;
    b.onclick=()=>{
      if(grammarQuizAnswered)return;
      grammarQuizAnswered=true; grammarQuizCount++;
      if(o.i===target._i){
        b.classList.add('correct'); grammarQuizCorrect++;
      } else {
        b.classList.add('wrong'); grammarReview.add(target._i); saveGrammarState();
        [...$('grammarQuizChoices').children].forEach(c=>{if(c.textContent===target.meaning)c.classList.add('correct')});
      }
      $('grammarQuizResult').innerHTML=`<div class="box"><div class="label">예문</div><div class="example">${target.example}</div><div class="translation">${target.translation}</div>${o.i!==target._i?'<div class="notice">틀린 문법은 자동으로 ‘다시보기’에 등록했어요.</div>':''}</div>`;
      document.querySelector('.grammar-quiz-score').textContent=`${grammarQuizCorrect} / ${grammarQuizCount} 정답`;
      $('nextGrammarQuiz').classList.remove('hidden');
    };
    $('grammarQuizChoices').appendChild(b);
  });
  $('grammarQuizHear').onclick=()=>speakJapanese(target.example);
  $('nextGrammarQuiz').onclick=newGrammarQuiz;
}

const META={'18':'DAY 18 · 일상생활','37':'DAY 37 · 자연·환경'}; let day=null,words=[],idx=0,known=new Set(),review=new Set(),quizAnswered=false,quizCorrect=0,quizCount=0,currentQuiz=null; const $=id=>document.getElementById(id);
function key(n){return `jp_${day}_${n}`} function loadState(){idx=Number(localStorage.getItem(key('idx'))||0);known=new Set(JSON.parse(localStorage.getItem(key('known'))||'[]'));review=new Set(JSON.parse(localStorage.getItem(key('review'))||'[]'));if(idx>=words.length)idx=0} function save(){localStorage.setItem(key('idx'),idx);localStorage.setItem(key('known'),JSON.stringify([...known]));localStorage.setItem(key('review'),JSON.stringify([...review]))}
function openDay(d){day=d;words=DAYS[d];loadState();$('home').classList.add('hidden');$('grammar').classList.add('hidden');$('studyHead').classList.remove('hidden');$('title').textContent=META[d];$('subtitle').textContent=`${words.length}단어 · 단어카드 + 한자 풀이 + 예문 + 퀴즈 + 오답복습`;document.querySelectorAll('.daybar button[data-day]').forEach(b=>b.classList.toggle('active',b.dataset.day===d));switchTab('cards');renderCard();renderReview()}
function goHome(){day=null;$('title').textContent='JLPT 일본어 단어';$('subtitle').textContent='DAY를 선택해 공부하세요';$('studyHead').classList.add('hidden');['cards','list','quiz','review','grammar'].forEach(x=>$(x).classList.add('hidden'));$('home').classList.remove('hidden');document.querySelectorAll('.daybar button').forEach(b=>b.classList.remove('active'))}
function updateStats(){$('progressBar').style.width=(known.size/words.length*100)+'%';$('statKnown').textContent=`암기 ${known.size}`;$('statTotal').textContent=`${idx+1} / ${words.length}`} function renderCard(){const w=words[idx];$('counter').textContent=`${idx+1} / ${words.length}`;$('word').textContent=w.word;$('reading').textContent=w.reading;$('meaning').textContent=w.meaning;$('parts').textContent=w.parts;$('example').textContent=w.example;$('translation').textContent=w.translation;$('knownBtn').textContent=known.has(idx)?'암기 완료 ✓':'외웠어요';$('unknownBtn').textContent=review.has(idx)?'복습 등록 ✓':'다시 보기';updateStats();save()}
$('prevBtn').onclick=()=>{idx=(idx-1+words.length)%words.length;renderCard()};$('nextBtn').onclick=()=>{idx=(idx+1)%words.length;renderCard()};$('knownBtn').onclick=()=>{known.add(idx);review.delete(idx);idx=(idx+1)%words.length;renderCard();renderReview()};$('unknownBtn').onclick=()=>{review.add(idx);renderCard();renderReview()};
function renderList(filter=''){const q=filter.trim().toLowerCase();$('listWrap').innerHTML='';words.forEach((w,i)=>{if(q&&!`${w.word} ${w.reading} ${w.meaning}`.toLowerCase().includes(q))return;const el=document.createElement('div');el.className='list-item';el.innerHTML=`<div class="list-word">${w.word}</div><div class="list-info"><div class="list-read">${w.reading}</div><div class="list-mean">${w.meaning}</div></div><span class="badge">${known.has(i)?'암기완료':review.has(i)?'복습':'학습전'}</span>`;el.onclick=()=>{idx=i;switchTab('cards');renderCard()};$('listWrap').appendChild(el)})} $('search').oninput=e=>renderList(e.target.value);function shuffled(a){return [...a].sort(()=>Math.random()-.5)}
function newQuiz(){quizAnswered=false;$('nextQuiz').classList.add('hidden');currentQuiz=Math.floor(Math.random()*words.length);const w=words[currentQuiz];$('quizWord').textContent=w.word;$('quizReading').textContent=w.reading;const wrongs=shuffled(words.map((x,i)=>({m:x.meaning,i})).filter(x=>x.i!==currentQuiz)).slice(0,3);const opts=shuffled([{m:w.meaning,i:currentQuiz},...wrongs]);$('choices').innerHTML='';opts.forEach(o=>{const b=document.createElement('button');b.className='choice';b.textContent=o.m;b.onclick=()=>{if(quizAnswered)return;quizAnswered=true;quizCount++;if(o.i===currentQuiz){b.classList.add('correct');quizCorrect++;known.add(currentQuiz);review.delete(currentQuiz)}else{b.classList.add('wrong');review.add(currentQuiz);[...$('choices').children].forEach(c=>{if(c.textContent===w.meaning)c.classList.add('correct')})}$('quizScore').textContent=`${quizCorrect} / ${quizCount} 정답`;$('nextQuiz').classList.remove('hidden');save();updateStats();renderReview()};$('choices').appendChild(b)})} $('nextQuiz').onclick=newQuiz;
function renderReview(){$('reviewWrap').innerHTML='';if(review.size===0){$('reviewWrap').innerHTML='<div class="sub">아직 복습할 단어가 없어요.</div>';return}[...review].forEach(i=>{const w=words[i],el=document.createElement('div');el.className='list-item';el.innerHTML=`<div class="list-word">${w.word}</div><div class="list-info"><div class="list-read">${w.reading}</div><div class="list-mean">${w.meaning}</div></div>`;el.onclick=()=>{idx=i;switchTab('cards');renderCard()};$('reviewWrap').appendChild(el)})}
function switchTab(name){['cards','list','quiz','review'].forEach(id=>$(id).classList.toggle('hidden',id!==name));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));if(name==='list')renderList($('search').value);if(name==='quiz')newQuiz();if(name==='review')renderReview()} document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));document.querySelectorAll('[data-open]').forEach(e=>e.onclick=()=>openDay(e.dataset.open));document.querySelectorAll('.daybar button[data-day]').forEach(e=>e.onclick=()=>openDay(e.dataset.day));$('homeBtn').onclick=goHome;
$('grammarBtn').onclick=openGrammar;
$('grammarSearch').oninput=renderGrammar;
document.querySelectorAll('[data-grammar-mode]').forEach(b=>b.onclick=()=>setGrammarMode(b.dataset.grammarMode));
document.querySelectorAll('[data-grammar-group]').forEach(b=>b.onclick=()=>{
  grammarGroup=b.dataset.grammarGroup;
  document.querySelectorAll('[data-grammar-group]').forEach(x=>x.classList.toggle('active',x===b));
  if(grammarMode==='quiz')newGrammarQuiz(); else renderGrammar();
});
document.querySelectorAll('[data-grammar-level]').forEach(b=>b.onclick=()=>{
  grammarLevel=b.dataset.grammarLevel;
  document.querySelectorAll('[data-grammar-level]').forEach(x=>x.classList.toggle('active',x===b));
  if(grammarMode==='quiz')newGrammarQuiz(); else renderGrammar();
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
